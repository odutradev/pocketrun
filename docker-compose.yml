services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
      - "8081"
    environment:
      - PUBLIC_PORT=8080
      - ADMIN_PORT=8081
      - API_MODE=all
      - ENV=${ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - ADMIN_CORS_ALLOWED_ORIGINS=${ADMIN_CORS_ALLOWED_ORIGINS:-*}
      - MONGODB_URI=${MONGODB_URI:-${MONGO_URI:-${MONGOURI}}}
      - MONGODB_NAME=${MONGODB_NAME:-pocketrun}
      - JWT_SECRET=${JWT_SECRET:-pocketrun-secret-key-change-in-production}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - pocketrun-network

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://admin.pocketrun.odutra.com}
        - VITE_ADMIN_API_URL=${VITE_ADMIN_API_URL:-${VITE_API_URL:-https://admin.pocketrun.odutra.com}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pocketrun-network

networks:
  pocketrun-network:
    driver: bridge
