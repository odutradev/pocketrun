services:
  # --- Opção A: Container MongoDB Local ---
  # Se for utilizar MongoDB Atlas / URI externo no Dokploy, este container pode ser desativado ou removido.
  mongodb:
    image: mongo:latest
    container_name: pocketrun-mongodb
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=${MONGODB_NAME:-pocketrun}
    volumes:
      - mongodb_data:/data/db

  api:
    image: darknx/pocketrun-api:latest
    container_name: pocketrun-api
    restart: always
    expose:
      - "8080"
    environment:
      - PORT=${PORT:-8080}
      - ENV=${ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      # MONGODB_URI pode apontar para o container local (mongodb://mongodb:27017) 
      # ou para a nuvem/Atlas (mongodb+srv://usuario:senha@cluster0.xxx.mongodb.net)
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_NAME=${MONGODB_NAME:-pocketrun}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  ui:
    image: darknx/pocketrun-ui:latest
    container_name: pocketrun-ui
    restart: always
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb_data:
