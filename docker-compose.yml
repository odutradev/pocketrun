services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:80"
    environment:
      - PORT=80
      - API_MODE=public
      - APP_ENV=production
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - app-network

  admin:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ADMIN_PORT:-5001}:80"
    environment:
      - ADMIN_PORT=80
      - API_MODE=admin
      - APP_ENV=production
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - app-network

  ui:
    build:
      context: ./ui
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5001}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
      - admin
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
