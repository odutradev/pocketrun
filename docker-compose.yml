services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - APP_ENV=production
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - app-network

  ui:
    build:
      context: ./ui
      additional_contexts:
        project: .
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
        - VITE_LINKS_URL=${LINKS_URL:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
