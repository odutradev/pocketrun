version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: pocketrun-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGODB_NAME:-pocketrun}
    volumes:
      - mongodb_data:/data/db

  api:
    image: darknx/pocketrun-api:latest
    container_name: pocketrun-api
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    expose:
      - "8080"
    environment:
      - PORT=${PORT:-8080}
      - ENV=${ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_NAME=${MONGODB_NAME:-pocketrun}
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  ui:
    image: darknx/pocketrun-ui:latest
    container_name: pocketrun-ui
    restart: always
    ports:
      - "${UI_PORT:-3001}:80"
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb_data:
