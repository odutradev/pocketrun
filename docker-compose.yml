services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - APP_ENV=production
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  ui:
    build:
      context: ./ui
      additional_contexts:
        project: .
    restart: unless-stopped
    environment:
      - API_URL=${API_URL}
      - LINKS_URL=${LINKS_URL}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
