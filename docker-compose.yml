services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - APP_ENV=production
    networks:
      - app-network

  ui:
    build:
      context: ./ui
      additional_contexts:
        project: .
    restart: unless-stopped
    environment:
      - API_URL=${API_URL}
      - LINKS_URL=${LINKS_URL}
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
