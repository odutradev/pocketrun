services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-5002}:80"
    environment:
      - PORT=80
      - ENV=${ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-${CORS_ORIGIN:-*}}
      - MONGODB_URI=${MONGODB_URI:-${MONGO_URI:-${MONGOURI}}}
      - MONGODB_NAME=${MONGODB_NAME:-pocketrun}
      - JWT_SECRET=${JWT_SECRET:-${JWT:-pocketrun-secret-key-change-in-production}}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - pocketrun-network

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5002}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-${UI_PORT:-3000}}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pocketrun-network

networks:
  pocketrun-network:
    driver: bridge
