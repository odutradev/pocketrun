# Carregado automaticamente pelo `docker compose up` local, publica as portas no host.
# O Dokploy roda só com `-f docker-compose.yml`, então em produção nada é publicado
# e o Traefik roteia pelos domínios, sem disputar portas com outros serviços do servidor.
services:
  api:
    ports:
      - "${PORT:-5000}:80"

  ui:
    ports:
      - "${FRONTEND_PORT:-3000}:80"
